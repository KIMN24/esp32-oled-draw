<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dibuja aquí</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#242a3c;background:#f5f6fa}*{box-sizing:border-box}body{margin:0;padding:28px 16px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #dce0ea;background:#fff;color:#273047;padding:11px 16px;border-radius:12px;font-weight:600;transition:background .15s,transform .15s}button:hover{background:#eef0f8}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b9b5f8;outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#6256ce;color:white;border-color:#6256ce}.primary:hover{background:#5045b8}.selected{background:#eceaff;border-color:#a49df1;color:#4c40a9}.app{max-width:740px;margin:auto;background:#fff;border:1px solid #e8eaf1;border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:0 12px 40px #2730470b}header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:clamp(25px,4vw,32px);letter-spacing:-.035em;margin:0}p{margin:8px 0 20px;color:#6b7285;font-size:14px}.pill{font-size:12px;color:#6b7285;background:#f2f3f8;padding:8px 12px;border-radius:99px}.panel{background:#f9f9fc;border:1px solid #e8eaf1;border-radius:16px;padding:16px;margin:16px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex-shrink:0}.spread{justify-content:space-between}.field{display:flex;flex-direction:column;gap:6px;color:#4e576b;font-size:13px;font-weight:600}.field input,.field select,.field textarea{border:1px solid #dce0ea;border-radius:10px;padding:10px;background:white;color:#273047}.field textarea{resize:vertical;min-height:76px;width:100%}.field.grow{flex:1;min-width:170px}.canvas-wrap{background:#131d30;border:9px solid #293449;border-radius:17px;padding:6px;box-shadow:0 6px 22px #10182720;margin:14px 0 8px}canvas{display:block;width:100%;aspect-ratio:2;image-rendering:pixelated;touch-action:none;cursor:crosshair}.caption{display:flex;justify-content:space-between;color:#778096;font-size:12px;gap:8px}.hidden{display:none!important}.status{margin-top:14px;border-radius:10px;padding:11px 13px;background:#f4f5f9;color:#5a6478;font-size:13px;min-height:40px}.login{max-width:400px;margin:22px auto 0}.login .field{margin-bottom:12px}.login input{width:100%}#logout{margin-left:auto}.toggle{font-size:13px;color:#4e576b;display:flex;align-items:center;gap:8px}.toggle input{accent-color:#6256ce;width:17px;height:17px}@media(max-width:500px){body{padding:10px}.app{border-radius:16px}.row button{flex-grow:1}#logout{margin-left:0}.caption{font-size:11px}}
</style></head><body><main class="app"><header><div><h1>Dibuja aquí</h1><p>Escribe o dibuja lo que quieras mostrar en la pantalla.</p></div><span class="pill">OLED · 128 × 64</span></header>
<section id="login" class="login"><label class="field">Correo electrónico<input id="email" type="email" placeholder="correo@ejemplo.com" autocomplete="username"></label><label class="field">Contraseña<input id="password" type="password" placeholder="Tu contraseña" autocomplete="current-password"></label><button id="enter" class="primary" style="width:100%">Iniciar sesión</button></section>
<section id="editor" class="hidden"><div class="row" style="margin:14px 0"><button id="draw" class="selected">✏️ Dibujar</button><button id="textMode">T Texto</button><button id="logout">Cerrar sesión</button></div>
<div id="textTools" class="panel hidden"><label class="field">Tu mensaje<textarea id="message" maxlength="140" placeholder="Escribe aquí..."></textarea></label><div class="row" style="margin-top:12px"><label class="field">Tamaño de texto<select id="fontSize"><option value="8">Pequeño · 8 px</option><option value="10" selected>Normal · 10 px</option><option value="12">Mediano · 12 px</option><option value="16">Grande · 16 px</option><option value="20">Muy grande · 20 px</option><option value="24">Extra grande · 24 px</option></select></label><label class="field">Alineación<select id="alignText"><option value="left">Izquierda</option><option value="center" selected>Centro</option><option value="right">Derecha</option></select></label><button id="applyText" class="primary" style="align-self:end">Aplicar texto</button></div></div>
<div class="panel"><div class="row"><label class="field">Tamaño del pincel<select id="brush"><option value="1">1 px</option><option value="2" selected>2 px</option><option value="3">3 px</option><option value="5">5 px</option><option value="8">8 px</option></select></label><button id="erase" style="align-self:end">◻ Borrador</button><button id="clear" style="align-self:end">↺ Limpiar</button><button id="heart" style="align-self:end">♡ Ejemplo</button></div></div>
<div class="canvas-wrap"><canvas id="screen" width="128" height="64" aria-label="Lienzo de dibujo"></canvas></div><div class="caption"><span>Vista previa de la pantalla</span><span>Blanco y negro</span></div>
<div class="row spread" style="margin-top:20px"><label class="toggle"><input type="checkbox" id="auto" checked> Envío automático</label><button id="send" class="primary">Enviar a la pantalla ↗</button></div></section><div id="status" class="status" role="status" aria-live="polite">Inicia sesión para continuar.</div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,set,onValue} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
// Sustituye estos datos por los de Configuración del proyecto > Tu app web.
const firebaseConfig={apiKey:'AIzaSyA95LxLIPW_IOwjwy5fkV4l6D4uOR7EnYE',authDomain:'proyectoj-49e24.firebaseapp.com',databaseURL:'https://proyectoj-49e24-default-rtdb.firebaseio.com',projectId:'proyectoj-49e24',appId:'1:326854869467:web:47265f6ec50091b8e5e7fe'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id),canvas=$('screen'),ctx=canvas.getContext('2d',{willReadFrequently:true});
let drawing=false,last=null,eraser=false,mode='draw',timer=null,unsub=null,remoteApplying=false;
const bg='#09111f',fg='#ffffff';
function clear(){ctx.fillStyle=bg;ctx.fillRect(0,0,128,64)}clear();
function status(s){$('status').textContent=s}
function point(e){const r=canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(127,Math.floor((e.clientX-r.left)*128/r.width))),y:Math.max(0,Math.min(63,Math.floor((e.clientY-r.top)*64/r.height)))}}
function paint(p){ctx.fillStyle=eraser?bg:fg;const n=Number($('brush').value);ctx.fillRect(p.x-Math.floor(n/2),p.y-Math.floor(n/2),n,n)}
function changed(){if(!$('auto').checked||remoteApplying)return;clearTimeout(timer);timer=setTimeout(send,500)}
canvas.addEventListener('pointerdown',e=>{if(mode!=='draw')return;drawing=true;canvas.setPointerCapture(e.pointerId);last=point(e);paint(last)});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.strokeStyle=eraser?bg:fg;ctx.lineWidth=Number($('brush').value);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
canvas.addEventListener('pointerup',()=>{if(drawing){drawing=false;changed()}});canvas.addEventListener('pointercancel',()=>{drawing=false});
function encode(){const d=ctx.getImageData(0,0,128,64).data;const bytes=new Uint8Array(1024);for(let y=0;y<64;y++)for(let x=0;x<128;x++){const i=(y*128+x)*4;if(d[i]+d[i+1]+d[i+2]>380)bytes[x+Math.floor(y/8)*128]|=1<<(y%8)}return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}
function decode(hex){if(!/^[0-9a-f]{2048}$/i.test(hex))return;remoteApplying=true;clear();ctx.fillStyle=fg;for(let y=0;y<64;y++)for(let x=0;x<128;x++){const byte=parseInt(hex.slice((x+Math.floor(y/8)*128)*2,(x+Math.floor(y/8)*128)*2+2),16);if(byte&(1<<(y%8)))ctx.fillRect(x,y,1,1)}remoteApplying=false}
async function send(){if(!auth.currentUser)return;try{await set(ref(db,'oled/frame'),{data:encode(),version:Date.now()});status('✓ Enviado a Firebase')}catch(e){status('Error al enviar: '+e.message)}}
$('send').onclick=send;$('clear').onclick=()=>{clear();changed()};$('heart').onclick=()=>{clear();ctx.fillStyle=fg;ctx.font='14px sans-serif';ctx.fillText('♡',57,34);changed()};$('erase').onclick=()=>{eraser=!eraser;$('erase').classList.toggle('selected',eraser);$('erase').textContent=eraser?'◻ Borrador activo':'◻ Borrador'};
$('draw').onclick=()=>{mode='draw';$('draw').classList.add('selected');$('textMode').classList.remove('selected');$('textTools').classList.add('hidden')};$('textMode').onclick=()=>{mode='text';$('textMode').classList.add('selected');$('draw').classList.remove('selected');$('textTools').classList.remove('hidden')};
function renderText(){
 const size=Number($('fontSize').value),lineHeight=size+2;
 const maxLines=Math.floor((64-4)/lineHeight);
 const text=$('message').value;
 clear();ctx.fillStyle=fg;ctx.font=`${size}px monospace`;ctx.textBaseline='top';
 const lines=[];
 for(const paragraph of text.split('\n')){
  let line='';
  for(const word of paragraph.split(' ')){
   const candidate=line?line+' '+word:word;
   if(ctx.measureText(candidate).width<=122){line=candidate;continue}
   if(line){lines.push(line);line=''}
   for(const ch of word){if(ctx.measureText(line+ch).width>122&&line){lines.push(line);line=''}line+=ch}
  }
  lines.push(line);
 }
 lines.slice(0,maxLines).forEach((line,i)=>{
  const width=ctx.measureText(line).width;
  const x=$('alignText').value==='center'?(128-width)/2:$('alignText').value==='right'?126-width:2;
  ctx.fillText(line,Math.max(0,x),2+i*lineHeight);
 });
 changed();
}
$('applyText').onclick=renderText;
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});$('enter').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){status('No se pudo iniciar sesión: '+e.code)}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{if(unsub){unsub();unsub=null}clearTimeout(timer);$('login').classList.toggle('hidden',!!user);$('editor').classList.toggle('hidden',!user);if(user){status('Conectado: '+user.email);unsub=onValue(ref(db,'oled/frame'),snap=>{const v=snap.val();if(v?.data)decode(v.data)},e=>status('Error de lectura: '+e.message))}else status('Inicia sesión para continuar.')});
</script></body></html>
